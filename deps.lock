# deps.lock — every third-party input of the Android APK, pinned.
#
# Read by tools/ci/deps.py (tools/ci/fetch-deps.sh, CI job `deps-lock`) and tests/test_deps_lock.py.
# Fields are separated by `|` (spaces around them are ignored). Lines starting with `#` are comments.
#
#   dep  | name | version | license (SPDX) | in source tarball (yes/no) | sha256 | url
#        A file downloaded from its upstream and checked against sha256 before any use.
#        "in source tarball = yes": the archive is copied as-is into letsgo-<ver>-source.tar.gz (the corresponding
#        source of every LGPL/GPL part, and the sources of everything else built from source).
#   tool | name | version | license (SPDX) | no | - | how it is installed
#        Installed by a package manager that checks its own downloads (not by deps.py).
#   lic  | LICENSES/<file> | dep name | path inside the archive (or `.` for a plain file) | [first-last lines]
#        The committed license text must be byte-identical to that member (CI `deps-lock` checks it); one file
#        may serve two entries when both archives carry the same text.
#
# Versions: the ones the code expects (SDL 3.4.18: src/runtime/nvn/vulkan/device.c; zig 0.17.0:
# src/tools/fetch_zig.sh; FFmpeg 9.0.2: src/tools/build_deps_windows.sh; libarchive/xz: build-modunpack.sh;
# libadrenotools 8fae8ce: docs/performance/driver.cpp.orig), and for the on-device builder kit the ones of
# Nycolazs/LASRecomp-Android-Plus android-v1.2.0 (tools/android/ondevice/*.sh, MIT), whose kit this replaces.
# shaderc's glslang / SPIRV-Tools / SPIRV-Headers: the revisions in shaderc v2026.3's DEPS file.

